name: Blog CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run resources:check
      - run: pnpm lint
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run test:preview
      - uses: actions/upload-artifact@v4
        with:
          name: blog-dist
          path: dist/
          retention-days: 7
